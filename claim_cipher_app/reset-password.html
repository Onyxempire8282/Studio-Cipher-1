<!DOCTYPE html>
<html lang="en">
<head>
  <base href="/claim_cipher_app/">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password - Claim Cipher</title>

    <link rel="stylesheet" href="css/app.css">
    <link rel="stylesheet" href="styles/login-layout.css">
</head>
<body style="visibility: hidden;">

    <div class="auth-container">
        <div class="cipher-content">
            <div class="login-plate">
                <div class="rivet tl"></div><div class="rivet tr"></div><div class="rivet bl"></div><div class="rivet br"></div>
                <div class="auth-brand-header">
                    <div class="brand-lockup">
                        <img src="assets/logo.png" alt="Claim Cipher" class="brand-mark" width="48" height="48" />
                        <div class="brand-text">
                            <span class="brand-name"><span class="brand-accent">CLAIM</span>CIPHER<sup class="brand-tm">&trade;</sup></span>
                        </div>
                    </div>
                </div>
                <div class="auth-brand-divider" aria-hidden="true"></div>

                <div class="reset-header">
                    <h1 class="reset-title">Reset Password</h1>
                    <p class="reset-subtitle">Enter a new password for your account.</p>
                </div>

                <form id="reset-password-form">
                    <div class="form-cipher-group">
                        <label class="form-cipher-label" for="new-password">New Password</label>
                        <input type="password" class="form-cipher-input" id="new-password" required>
                    </div>

                    <div class="form-cipher-group">
                        <label class="form-cipher-label" for="confirm-password">Confirm Password</label>
                        <input type="password" class="form-cipher-input" id="confirm-password" required>
                    </div>

                    <button type="submit" class="cipher-btn cipher-btn--primary cipher-btn--full" id="reset-password-btn">
                        Update Password
                    </button>
                </form>

                <div id="reset-status" class="reset-message" aria-live="polite"></div>
            </div>
        </div>
    </div>

    <script defer src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script defer src="config/github-pages-env.js"></script>
    <script defer src="scripts/supabase-config.js"></script>
    <script defer src="scripts/supabase-auth.js"></script>
    <script defer src="scripts/reset-password.js"></script>
</body>
</html>
