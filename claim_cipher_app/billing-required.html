<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Billing Required - Claim Cipher</title>
  <link rel="stylesheet" href="styles/universal-system.css" />
  <link rel="stylesheet" href="styles/industrial-plates.css" />
  <style>
    .billing-required-page {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: radial-gradient(circle at top, #f7f7f7, #e6e6e6);
      padding: 40px 20px;
    }

    .billing-required-card {
      max-width: 520px;
      width: 100%;
      background: #ffffff;
      border-radius: 16px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.12);
      padding: 32px;
      text-align: center;
    }

    .billing-required-card h1 {
      margin: 0 0 12px;
      font-size: 28px;
      color: #1f2933;
    }

    .billing-required-card p {
      margin: 0 0 24px;
      color: #4b5563;
      line-height: 1.6;
    }

    .billing-actions {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .billing-actions .cipher-btn {
      width: 100%;
      justify-content: center;
    }
    #billing-error { display: none; margin: 0 0 16px; color: #b42318; }
  </style>
</head>
<body>
  <main class="billing-required-page">
    <div class="billing-required-card">
      <h1>Subscription Required</h1>
      <p>
        An active Basic or Pro subscription is required to access Claim Cipher.
        Activate your Basic plan to continue.
      </p>
      <div id="billing-error"></div>
      <div class="billing-actions">
        <button id="activateClaimCipher" class="cipher-btn primary-action-btn">
          <div class="rivet tl"></div>
          <div class="rivet tr"></div>
          <div class="rivet bl"></div>
          <div class="rivet br"></div>
          Activate Claim Cipher
        </button>
        <button class="cipher-btn secondary-btn" onclick="handleLogout()">
          <div class="rivet tl"></div>
          <div class="rivet tr"></div>
          <div class="rivet bl"></div>
          <div class="rivet br"></div>
          Sign Out
        </button>
      </div>
    </div>
  </main>

  <script defer src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script defer src="config/github-pages-env.js"></script>
  <script defer src="scripts/supabase-config.js"></script>
  <script defer src="scripts/supabase-auth.js"></script>
  <script defer src="scripts/billing.js"></script>
  <script>
    document.addEventListener("DOMContentLoaded", () => {

      document.body.style.visibility = "visible";

      const activateButton = document.getElementById("activateClaimCipher");
      const errorEl = document.getElementById("billing-error");
      if (!activateButton) return;

      const originalText = activateButton.textContent;

      activateButton.addEventListener("click", async () => {
        activateButton.disabled = true;
        activateButton.textContent = "Redirecting...";
        if (errorEl) {
          errorEl.textContent = "";
          errorEl.style.display = "none";
        }

        try {
          const supabase = window.SupabaseAuth?.init?.();
          if (!supabase) {
            window.location.href = "login-cypher.html";
            return;
          }

          const { data: userData, error: userError } = await supabase.auth.getUser();

          if (userError || !userData?.user) {
            window.location.href = "login-cypher.html";
            return;
          }

          const { data: sessionData } = await supabase.auth.getSession();
          const accessToken = sessionData?.session?.access_token;

          if (!accessToken) {
            if (errorEl) {
              errorEl.textContent = "Authentication error. Please log in again.";
              errorEl.style.display = "block";
            }
            activateButton.disabled = false;
            activateButton.textContent = originalText;
            return;
          }



          const baseUrl = window.SUPABASE_CONFIG?.url || "";
          const response = await fetch(`${baseUrl}/functions/v1/create-checkout-session`, {
            method: "POST",
            headers: {
              "Content-Type": "application/json",
              "Authorization": `Bearer ${accessToken}`,
            },
            body: JSON.stringify({ plan: "basic" }),
          });

          if (!response.ok) {
            let message = "Unable to start checkout.";
            try {
              const payload = await response.json();
              message = payload?.error || JSON.stringify(payload) || message;
            } catch (jsonError) {
              const errorText = await response.text();
              message = errorText || message;
            }
            void 0; // checkout session error
            if (errorEl) {
              errorEl.textContent = message;
              errorEl.style.display = "block";
            }
            activateButton.disabled = false;
            activateButton.textContent = originalText;
            return;
          }

          const data = await response.json();
          if (data?.url) {
            window.location.href = data.url;
            return;
          }

          throw new Error("Checkout session missing URL");
        } catch (error) {
          void 0; // checkout handler error
          if (errorEl) {
            errorEl.textContent = error.message || "Unable to start checkout.";
            errorEl.style.display = "block";
          }
          activateButton.disabled = false;
          activateButton.textContent = originalText;
        }
      });
    });
  </script>
</body>
</html>
