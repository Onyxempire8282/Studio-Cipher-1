<!DOCTYPE html>
<html lang="en">
<head>
  <base href="/claim_cipher_app/">
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/png" href="assets/logo.png">
    <title>Total Loss Studio - Claim Cipher</title>
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Mono:wght@300;400;500&family=Barlow:wght@300;400;500;600&display=swap" rel="stylesheet">

    <!-- Shared design system -->
    <link rel="stylesheet" href="css/app.css" />

    <!-- Total Loss V2 - Scoped layout -->
    <link rel="stylesheet" href="modules/total-loss-v2/total-loss-v2.css" />
</head>
<body style="visibility: hidden;">
    <nav class="nav">
        <a href="command-center.html" class="nav-logo"><img src="assets/logo.png" alt="Claim Cipher"></a>
        <div class="nav-tabs">
            <a class="nav-tab" href="command-center.html">Dashboard</a>
            <a class="nav-tab" href="route-cypher.html">Routes</a>
            <a class="nav-tab" href="mileage-cypher.html">Mileage</a>
            <a class="nav-tab" href="my-routes.html">My Routes</a>
            <a class="nav-tab active" href="total-loss-studio.html">Total Loss</a>
            <a class="nav-tab" href="settings.html">Settings</a>
        </div>
        <div class="nav-right">
            <div class="nav-user">
                <strong id="userName">Professional User</strong>
                Claims Specialist
            </div>
            <button class="nav-logout" onclick="handleLogout()">Logout</button>
        </div>
    </nav>

    <!-- PAGE HEADER -->
    <div class="page-header">
        <div class="page-header-inner">
            <div>
                <div class="page-label">Total Loss Studio</div>
                <div class="page-title">Load Estimate</div>
                <div class="page-sub">CCC estimate processing and BCIF form generation</div>
            </div>
            <div class="header-meta">
                Accepted Format <span>PDF</span><br>
                Max Size <span>25 MB</span><br>
                Source <span>CCC ONE</span>
            </div>
        </div>
    </div>

    <main class="main-content main-container">
        <div id="tl-v2-container" class="total-loss-v2-scope"></div>
    </main>

    <!-- Supabase JS v2 CDN -->
    <script defer src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <!-- Supabase Configuration and Auth -->
    <script defer src="config/github-pages-env.js"></script>
    <script defer src="scripts/supabase-config.js"></script>
    <script defer src="scripts/supabase-auth.js"></script>
    <script defer src="scripts/billing-guard.js"></script>

    <!-- Supabase Page Protection -->
    <script>
document.addEventListener('DOMContentLoaded', async function() {
        const allowed = await window.SupabaseAuth.protectPage();
        if (!allowed) return;

        const access = await window.BillingGuard.checkAccess();
        if (!window.BillingGuard.hasAccess(access.profile)) {
            window.location.href = "billing-required.html";
            return;
        }

        document.body.style.visibility = 'visible';
});
</script>

    <!-- Core Scripts -->
    <script defer src="scripts/cipher-core.js"></script>

    <!-- PDF.js — client-side PDF text extraction -->
    <script defer src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
    <script>
document.addEventListener('DOMContentLoaded', function() {
    pdfjsLib.GlobalWorkerOptions.workerSrc =
            'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
});
</script>

    <!-- JSZip — client-side BCIF DOCX template fill (no server needed) -->
    <script defer src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>

    <!-- Demo data (sets window.__tlsDemoPayload before module runs) -->
    <script defer src="scripts/demo-data.js"></script>

    <!-- Total Loss Studio Module -->
    <script type="module">
        import { initTotalLossStudio, initTotalLossDemo } from './modules/total-loss-v2/total-loss-studio.js';
        if (sessionStorage.getItem('demo_mode') === 'true' && window.__tlsDemoPayload) {
            initTotalLossDemo(window.__tlsDemoPayload, window.__tlsDemoParsed);
        } else {
            initTotalLossStudio();
        }
    </script>

    <script defer src="scripts/claim-cipher-system-qa.js"></script>
</body>
</html>
