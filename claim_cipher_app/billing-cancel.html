<!DOCTYPE html>
<html lang="en">
<head>

    <link rel="stylesheet" href="css/app.css">

<body>
    <main class="main-container" style="padding: 48px 24px; max-width: 720px; margin: 0 auto;">

            <div class="rivet tl"></div><div class="rivet tr"></div><div class="rivet bl"></div><div class="rivet br"></div>

            <div style="display: flex; flex-direction: column; gap: 12px;">

                <button class="cipher-btn" onclick="window.location.href='billing-required.html'">Return to Billing</button>

    <script defer src="config/github-pages-env.js"></script>
