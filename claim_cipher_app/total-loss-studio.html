<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Total Loss Studio - Claim Cipher</title>

    <!-- Universal System - Base styling -->
    <link rel="stylesheet" href="styles/universal-system.css" />

    <!-- Industrial Plate System - Shared visual language -->
    <link rel="stylesheet" href="styles/industrial-plates.css" />

    <!-- Total Loss V2 - Scoped layout -->
    <link rel="stylesheet" href="modules/total-loss-v2/total-loss-v2.css" />
</head>
<body style="visibility: hidden;">
    <header class="cipher-header">
        <div class="header-content">
            <div class="app-brand">
                <img src="../branding/logo/claimcipher-mark.png" alt="Claim Cipher" class="nav-logo" />
            </div>
            <div class="nav-links">
                <a href="command-center.html">Dashboard</a>
                <a href="route-cypher.html">Routes</a>
                <a href="mileage-cypher.html">Mileage</a>
                <a href="my-routes.html">My Routes</a>
                <a href="total-loss-studio.html" class="active">Total Loss</a>
            </div>
            <div class="user-section">
                <div class="user-info">
                    <div class="user-name" id="userName">Professional User</div>
                    <div class="user-role">Claims Specialist</div>
                </div>
                <button class="cipher-btn logout-btn" onclick="handleLogout()">
                    <div class="rivet tl"></div>
                    <div class="rivet tr"></div>
                    <div class="rivet bl"></div>
                    <div class="rivet br"></div>
                    Logout
                </button>
            </div>
        </div>
    </header>

    <main class="main-content main-container">
        <div id="tl-v2-container" class="total-loss-v2-scope"></div>
    </main>

    <!-- Supabase JS v2 CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <!-- Supabase Configuration and Auth -->
    <script src="scripts/supabase-config.js"></script>
    <script src="scripts/supabase-auth.js"></script>

    <!-- Supabase Page Protection -->
    <script>
    (async function() {
        const allowed = await window.SupabaseAuth.protectPage();
        if (allowed) {
            document.body.style.visibility = 'visible';
        }
    })();
    </script>

    <!-- Core Scripts -->
    <script src="scripts/cipher-core.js"></script>

    <!-- PDF.js — client-side PDF text extraction -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
    <script>
        pdfjsLib.GlobalWorkerOptions.workerSrc =
            'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
    </script>

    <!-- pdf-lib — client-side BCIF PDF generation (no server needed) -->
    <script src="https://unpkg.com/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script>

    <!-- Total Loss Studio Module -->
    <script type="module">
        import { initTotalLossStudio } from './modules/total-loss-v2/total-loss-studio.js';
        initTotalLossStudio();
    </script>

    <script src="scripts/claim-cipher-system-qa.js"></script>
</body>
</html>
