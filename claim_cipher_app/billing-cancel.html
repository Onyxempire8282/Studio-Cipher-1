<!DOCTYPE html>
<html lang="en">
<head>
  <base href="/claim_cipher_app/">
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Checkout Canceled — Claim Cipher</title>
  <link rel="icon" type="image/png" href="assets/logo.png">
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Mono:wght@300;400;500&family=Barlow:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --plate:       #0e0f11;
      --steel:       #161a1d;
      --steel-mid:   #1e2328;
      --amber:       #e8952a;
      --amber-dim:   rgba(232,149,42,0.12);
      --amber-line:  rgba(232,149,42,0.35);
      --white:       #edeae4;
      --text-hi:     #b8bdc2;
      --muted:       #4a5058;
      --rivet:       #2e353d;
      --rivet-hi:    #3d464f;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: var(--plate);
      font-family: 'Barlow', sans-serif;
      font-weight: 300;
      min-height: 100vh;
      display: grid;
      place-items: center;
      overflow-x: hidden;
    }

    /* grid texture */
    body::before {
      content: '';
      position: fixed; inset: 0; z-index: 0;
      background-image:
        linear-gradient(rgba(255,255,255,0.013) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,0.013) 1px, transparent 1px);
      background-size: 48px 48px;
      pointer-events: none;
    }

    .cancel-wrap {
      position: relative; z-index: 1;
      width: 100%; max-width: 440px;
      padding: 20px;
    }

    /* ── CARD ── */
    .card {
      background: var(--steel);
      border: 1px solid var(--rivet);
      border-top: 2px solid var(--muted);
      box-shadow:
        0 40px 80px rgba(0,0,0,0.8),
        0 8px 32px rgba(0,0,0,0.5);
      position: relative;
    }

    .card::before, .card::after {
      content: '';
      position: absolute;
      width: 10px; height: 10px;
      border-color: var(--muted);
      border-style: solid;
      opacity: 0.3;
    }
    .card::before { bottom: -1px; left: -1px; border-width: 0 0 1px 1px; }
    .card::after  { bottom: -1px; right: -1px; border-width: 0 1px 1px 0; }

    .rivet {
      position: absolute;
      width: 5px; height: 5px; border-radius: 50%;
      background: var(--rivet-hi); border: 1px solid var(--muted);
    }
    .rivet-tl { top: 10px; left: 12px; }
    .rivet-tr { top: 10px; right: 12px; }

    /* ── HEADER ── */
    .card-header {
      padding: 40px 32px 28px;
      border-bottom: 1px solid var(--rivet);
      background: var(--steel-mid);
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 14px;
    }

    .cancel-icon {
      width: 56px; height: 56px;
      border: 2px solid var(--muted);
      border-radius: 50%;
      display: grid;
      place-items: center;
      font-size: 24px;
      color: var(--muted);
      line-height: 1;
    }

    .card-title {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 28px;
      letter-spacing: 0.04em;
      color: var(--white);
      line-height: 1;
    }

    .card-subtitle {
      font-size: 13px;
      color: var(--text-hi);
      line-height: 1.5;
      max-width: 300px;
    }

    /* ── ACTIONS ── */
    .actions {
      padding: 28px 32px 32px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      align-items: center;
    }

    .btn-primary {
      width: 100%;
      padding: 14px;
      background: var(--amber);
      border: 1px solid var(--amber);
      color: #000;
      font-family: 'DM Mono', monospace;
      font-size: 12px;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
      box-shadow: 0 0 24px rgba(232,149,42,0.3);
      position: relative;
      overflow: hidden;
      border-radius: 0;
      text-align: center;
    }
    .btn-primary:hover {
      background: #f0a030;
      box-shadow: 0 0 36px rgba(232,149,42,0.5);
      transform: translateY(-1px);
    }
    .btn-primary::after {
      content: '';
      position: absolute; top: 0; left: -100%;
      width: 60%; height: 100%;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,0.15), transparent);
      transition: left 0.4s;
    }
    .btn-primary:hover::after { left: 140%; }

    .btn-secondary {
      width: 100%;
      padding: 10px;
      background: transparent;
      border: 1px solid var(--rivet);
      color: var(--muted);
      font-family: 'DM Mono', monospace;
      font-size: 10px;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      cursor: pointer;
      transition: all 0.2s;
      border-radius: 0;
      text-align: center;
    }
    .btn-secondary:hover {
      border-color: var(--amber-line);
      color: var(--text-hi);
      background: var(--amber-dim);
    }

    .signout-link {
      background: none;
      border: none;
      font-family: 'DM Mono', monospace;
      font-size: 9px;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--muted);
      cursor: pointer;
      padding: 4px 0;
      transition: color 0.2s;
    }
    .signout-link:hover { color: var(--text-hi); }

    /* ── FOOTER ── */
    .card-footer {
      padding: 12px 20px;
      border-top: 1px solid var(--rivet);
      background: var(--steel-mid);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }

    .footer-dot {
      width: 5px; height: 5px; border-radius: 50%;
      background: var(--amber); opacity: 0.5;
      animation: pulse-dot 2s ease-in-out infinite;
    }
    @keyframes pulse-dot {
      0%,100% { opacity: 0.4; }
      50% { opacity: 0.9; box-shadow: 0 0 6px rgba(232,149,42,0.6); }
    }

    .footer-text {
      font-family: 'DM Mono', monospace;
      font-size: 9px;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--muted);
    }

    /* ── VERSION ── */
    .version-strip {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 0 0;
    }
    .version-text {
      font-family: 'DM Mono', monospace;
      font-size: 9px;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: var(--rivet-hi);
    }
  </style>
</head>
<body>

  <div class="cancel-wrap">
    <div class="card">
      <div class="rivet rivet-tl"></div>
      <div class="rivet rivet-tr"></div>

      <!-- HEADER -->
      <div class="card-header">
        <div class="cancel-icon">&#10005;</div>
        <h1 class="card-title">Checkout Canceled</h1>
        <p class="card-subtitle">
          No changes were made to your account. You can try again whenever you're ready.
        </p>
      </div>

      <!-- ACTIONS -->
      <div class="actions">
        <button class="btn-primary" onclick="window.location.href='billing-required.html'">
          Try Again →
        </button>
        <button class="btn-secondary" onclick="startDemo()">
          Explore Demo First →
        </button>
        <button class="signout-link" onclick="handleLogout()">
          Sign out
        </button>
      </div>

      <!-- FOOTER -->
      <div class="card-footer">
        <div class="footer-dot"></div>
        <div class="footer-text">Secure · Encrypted · Operator-grade</div>
      </div>
    </div>

    <!-- VERSION -->
    <div class="version-strip">
      <div class="version-text">v2.8</div>
      <div class="version-text">ClaimCipher.io</div>
    </div>
  </div>

  <script defer src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script defer src="config/github-pages-env.js"></script>
  <script defer src="scripts/supabase-config.js"></script>
  <script defer src="scripts/supabase-auth.js"></script>
  <script>
    function startDemo() {
      sessionStorage.setItem("demo_mode", "true");
      sessionStorage.removeItem("claimCipherAuth");
      localStorage.removeItem("cipher_last_route");
      localStorage.removeItem("cipher_routes_by_day");
      window.location.replace("command-center.html");
    }
  </script>
</body>
</html>
